name: Build container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/goat-robotics/forge:main
            ghcr.io/goat-robotics/forge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ephemeral Droplets need to pull the worker image without receiving a
      # registry credential. The image contains no runtime secrets.
      - uses: actions/github-script@v7
        with:
          script: |
            await github.request('PATCH /orgs/{org}/packages/container/{package_name}', {
              org: context.repo.owner,
              package_name: 'forge',
              visibility: 'public'
            });
