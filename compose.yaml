name: forge-manufacturing
services:
  app:
    build: .
    image: forge-manufacturing:local
    ports:
      - "127.0.0.1:${PORT:-8100}:8100"
    volumes:
      - forge-data:/data
    environment:
      DATA_DIR: /data
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PUBLIC_URLS: ${PUBLIC_URLS:-}
      FORGE_SECRET: ${FORGE_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-}
      AUTH_MICROSOFT_ENTRA_ID_TENANT: ${AUTH_MICROSOFT_ENTRA_ID_TENANT:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEFAULT_ROLE: ${DEFAULT_ROLE:-viewer}
      FORGE_ALLOW_LOCAL_LOGIN: ${FORGE_ALLOW_LOCAL_LOGIN:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://sfo3.digitaloceanspaces.com}
      S3_REGION: ${S3_REGION:-sfo3}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    restart: unless-stopped
    read_only: true
    tmpfs: /tmp:size=1536m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 768m
  local-proxy:
    profiles: [local-domain]
    image: caddy:2.8.4
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./local-certs/${LOCAL_TLS_NAME:-forge.local}.pem:/etc/caddy/certs/site.pem:ro
      - ./local-certs/${LOCAL_TLS_NAME:-forge.local}-key.pem:/etc/caddy/certs/site-key.pem:ro
    environment:
      LOCAL_TLS_NAME: ${LOCAL_TLS_NAME:-forge.local}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  worker:
    image: forge-manufacturing:local
    command: [sh, -ec, 'if [ "$$CAD_EXECUTION_MODE" = ephemeral ]; then exec python -m app.dispatcher; else exec python -m app.worker; fi']
    environment:
      DATA_DIR: /data
      OMP_NUM_THREADS: "1"
      FORGE_DRAWING_WORKERS: ${FORGE_DRAWING_WORKERS:-3}
      FORGE_SECRET: ${FORGE_SECRET:-}
      CAD_EXECUTION_MODE: ${CAD_EXECUTION_MODE:-local}
      DO_TOKEN: ${DO_TOKEN:-}
      DO_WORKER_REGION: ${DO_WORKER_REGION:-}
      DO_WORKER_SIZE: ${DO_WORKER_SIZE:-s-4vcpu-8gb}
      DO_WORKER_BASE_IMAGE: ${DO_WORKER_BASE_IMAGE:-ubuntu-24-04-x64}
      DO_WORKER_IMAGE: ${DO_WORKER_IMAGE:-}
      DO_WORKER_TIMEOUT_SECONDS: ${DO_WORKER_TIMEOUT_SECONDS:-7200}
      GHCR_USERNAME: ${GHCR_USERNAME:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://sfo3.digitaloceanspaces.com}
      S3_REGION: ${S3_REGION:-sfo3}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - forge-data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: /tmp:size=2048m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 6g
    cpus: 3
volumes:
  forge-data:
